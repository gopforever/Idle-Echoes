kind = "web"
previewPath = "/"
title = "Melvor EQ2"
version = "1.0.0"
id = "artifacts/melvor-eq2"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25875

[services.development]
run = "pnpm --filter @workspace/melvor-eq2 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/melvor-eq2", "run", "build" ]
publicDir = "artifacts/melvor-eq2/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25875"
BASE_PATH = "/"
