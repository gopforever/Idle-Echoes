openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Melvor EQ2 Game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: character
  - name: combat
  - name: inventory
  - name: skills
  - name: items
  - name: enemies
  - name: crafting
  - name: creation
  - name: abilities
  - name: achievements
  - name: shop
  - name: zones
  - name: factions
  - name: aa
  - name: heroic
  - name: adornments
  - name: collections
  - name: mounts
  - name: world
  - name: gm

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── CHARACTER ──────────────────────────────────────────────────────────────
  /character:
    get:
      operationId: getCharacter
      tags: [character]
      summary: Get character state
      responses:
        "200":
          description: Character data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
    put:
      operationId: updateCharacter
      tags: [character]
      summary: Update character state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterUpdate"
      responses:
        "200":
          description: Updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  /character/stats:
    get:
      operationId: getCharacterStats
      tags: [character]
      summary: Get computed character stats (EQ2 formulas)
      responses:
        "200":
          description: Computed stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputedStats"

  /character/settings:
    put:
      operationId: updateCombatSettings
      tags: [character]
      summary: Update combat settings (auto-loop, auto-heal, meditation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CombatSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatSettings"

  /character/regen:
    post:
      operationId: applyRegen
      tags: [character]
      summary: Apply passive and meditation-boosted out-of-combat HP/Power regen
      description: >
        Called on a ~3s interval when the character is not in active combat.
        Computes elapsed time since the last call and restores HP/Power proportionally.
        If isMeditating is true a Meditation-level multiplier is applied and
        Meditation XP is awarded. Safe to call concurrently — uses compare-and-set
        on lastRegenAt to prevent double-crediting.
      responses:
        "200":
          description: Regen result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenResult"

  # ─── CHARACTER CREATION ──────────────────────────────────────────────────────
  /creation/options:
    get:
      operationId: getCreationOptions
      tags: [creation]
      summary: Get available races and classes for character creation
      responses:
        "200":
          description: Creation options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationOptions"

  /creation/create:
    post:
      operationId: createCharacter
      tags: [creation]
      summary: Create a new character (resets game)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "200":
          description: Created character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  # ─── COMBAT ──────────────────────────────────────────────────────────────────
  /combat/state:
    get:
      operationId: getCombatState
      tags: [combat]
      summary: Get current combat state
      responses:
        "200":
          description: Combat state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatState"

  /combat/start:
    post:
      operationId: startCombat
      tags: [combat]
      summary: Start combat with enemy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCombatRequest"
      responses:
        "200":
          description: Combat started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatState"

  /combat/stop:
    post:
      operationId: stopCombat
      tags: [combat]
      summary: Stop combat
      responses:
        "200":
          description: Combat stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatState"

  /combat/tick:
    post:
      operationId: tickCombat
      tags: [combat]
      summary: Advance combat by one tick and get result
      responses:
        "200":
          description: Combat tick result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatTickResult"

  /combat/log:
    get:
      operationId: getCombatLog
      tags: [combat]
      summary: Get recent combat log entries
      responses:
        "200":
          description: Combat log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CombatLogEntry"

  # ─── ABILITIES ───────────────────────────────────────────────────────────────
  /abilities:
    get:
      operationId: getAbilities
      tags: [abilities]
      summary: Get character's class abilities with cooldown status
      responses:
        "200":
          description: Abilities list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ability"

  /abilities/{abilityId}/activate:
    post:
      operationId: activateAbility
      tags: [abilities]
      parameters:
        - name: abilityId
          in: path
          required: true
          schema:
            type: string
      summary: Manually activate an ability (if off cooldown)
      responses:
        "200":
          description: Activation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbilityActivationResult"

  # ─── HEROIC OPPORTUNITIES ────────────────────────────────────────────────────
  /heroic/state:
    get:
      operationId: getHeroicState
      tags: [heroic]
      summary: Get current Heroic Opportunity chain state
      responses:
        "200":
          description: Heroic state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroicState"

  /heroic/trigger:
    post:
      operationId: triggerHeroic
      tags: [heroic]
      summary: Trigger a heroic opportunity step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeroicTriggerRequest"
      responses:
        "200":
          description: Heroic trigger result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroicTriggerResult"

  # ─── INVENTORY ───────────────────────────────────────────────────────────────
  /inventory:
    get:
      operationId: getInventory
      tags: [inventory]
      summary: Get player inventory
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"

  /inventory/equip:
    post:
      operationId: equipItem
      tags: [inventory]
      summary: Equip an item to a gear slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipRequest"
      responses:
        "200":
          description: Updated gear
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GearSet"

  /inventory/unequip:
    post:
      operationId: unequipItem
      tags: [inventory]
      summary: Unequip an item from a gear slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnequipRequest"
      responses:
        "200":
          description: Updated gear
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GearSet"

  /inventory/sell:
    post:
      operationId: sellItem
      tags: [inventory]
      summary: Sell an item for gold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellItemRequest"
      responses:
        "200":
          description: Sale result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellResult"

  # ─── ADORNMENTS ──────────────────────────────────────────────────────────────
  /adornments:
    get:
      operationId: getAdornments
      tags: [adornments]
      summary: Get available adornments in inventory
      responses:
        "200":
          description: Adornments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Adornment"

  /adornments/apply:
    post:
      operationId: applyAdornment
      tags: [adornments]
      summary: Apply an adornment to a gear slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyAdornmentRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdornmentResult"

  # ─── SKILLS ──────────────────────────────────────────────────────────────────
  /skills:
    get:
      operationId: getSkills
      tags: [skills]
      summary: Get all character skills
      responses:
        "200":
          description: Skills list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"

  /skills/{skillId}/toggle:
    post:
      operationId: toggleSkillTraining
      tags: [skills]
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: string
      summary: Toggle idle training for a skill
      responses:
        "200":
          description: Updated skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"

  /skills/summary:
    get:
      operationId: getSkillsSummary
      tags: [skills]
      summary: Get skill summary
      responses:
        "200":
          description: Skills summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsSummary"

  # ─── ITEMS ───────────────────────────────────────────────────────────────────
  /items:
    get:
      operationId: getItems
      tags: [items]
      summary: Get item database
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: slot
          in: query
          schema:
            type: string
        - name: minLevel
          in: query
          schema:
            type: integer
        - name: maxLevel
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /items/{itemId}:
    get:
      operationId: getItem
      tags: [items]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      summary: Get a specific item
      responses:
        "200":
          description: Item data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

  # ─── ENEMIES ─────────────────────────────────────────────────────────────────
  /enemies:
    get:
      operationId: getEnemies
      tags: [enemies]
      summary: Get enemy database
      parameters:
        - name: zone
          in: query
          schema:
            type: string
        - name: minLevel
          in: query
          schema:
            type: integer
        - name: maxLevel
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Enemies list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enemy"

  # ─── ZONES ───────────────────────────────────────────────────────────────────
  /zones:
    get:
      operationId: getZones
      tags: [zones]
      summary: Get all zones with unlock status
      responses:
        "200":
          description: Zones list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"

  /zones/{zoneId}/travel:
    post:
      operationId: travelToZone
      tags: [zones]
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
      summary: Travel to a zone
      responses:
        "200":
          description: Travel result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelResult"

  # ─── CRAFTING ────────────────────────────────────────────────────────────────
  /crafting/recipes:
    get:
      operationId: getCraftingRecipes
      tags: [crafting]
      summary: Get available crafting recipes
      responses:
        "200":
          description: Recipes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CraftingRecipe"

  /crafting/craft:
    post:
      operationId: craftItem
      tags: [crafting]
      summary: Craft an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CraftRequest"
      responses:
        "200":
          description: Craft result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CraftResult"

  # ─── SHOP ────────────────────────────────────────────────────────────────────
  /shop:
    get:
      operationId: getShopItems
      tags: [shop]
      summary: Get merchant shop inventory
      parameters:
        - name: zone
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Shop items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"

  /shop/buy:
    post:
      operationId: buyItem
      tags: [shop]
      summary: Purchase an item from the shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyRequest"
      responses:
        "200":
          description: Purchase result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyResult"

  # ─── ACHIEVEMENTS ─────────────────────────────────────────────────────────────
  /achievements:
    get:
      operationId: getAchievements
      tags: [achievements]
      summary: Get all achievements with completion status
      responses:
        "200":
          description: Achievements list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"

  /achievements/summary:
    get:
      operationId: getAchievementsSummary
      tags: [achievements]
      summary: Get achievement completion summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchievementsSummary"

  # ─── FACTIONS ────────────────────────────────────────────────────────────────
  /factions:
    get:
      operationId: getFactions
      tags: [factions]
      summary: Get all faction standings
      responses:
        "200":
          description: Factions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faction"

  # ─── ALTERNATE ADVANCEMENT ────────────────────────────────────────────────────
  /aa/tree:
    get:
      operationId: getAATree
      tags: [aa]
      summary: Get Alternate Advancement tree with spent points
      responses:
        "200":
          description: AA tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AATree"

  /aa/spend:
    post:
      operationId: spendAAPoint
      tags: [aa]
      summary: Spend an AA point on a node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpendAARequest"
      responses:
        "200":
          description: Updated AA tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AATree"

  # ─── COLLECTIONS ──────────────────────────────────────────────────────────────
  /collections:
    get:
      operationId: getCollections
      tags: [collections]
      summary: Get all collection sets with progress
      responses:
        "200":
          description: Collections list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"

  # ─── MOUNTS ──────────────────────────────────────────────────────────────────
  /mounts:
    get:
      operationId: getMounts
      tags: [mounts]
      summary: Get all mounts (owned and available to purchase)
      responses:
        "200":
          description: Mounts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mount"

  /mounts/{mountId}/equip:
    post:
      operationId: equipMount
      tags: [mounts]
      parameters:
        - name: mountId
          in: path
          required: true
          schema:
            type: string
      summary: Equip a mount
      responses:
        "200":
          description: Updated mount status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountResult"

  # ─── WORLD / GHOST PLAYERS ────────────────────────────────────────────────────
  /world/players:
    get:
      operationId: getWorldPlayers
      tags: [world]
      summary: Get all ghost/world players
      responses:
        "200":
          description: World players list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorldPlayer"

  /world/events:
    get:
      operationId: getWorldEvents
      tags: [world]
      summary: Get recent world events (living world feed)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: zone
          in: query
          schema:
            type: string
        - name: minImportance
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: World events list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorldEvent"

  /world/zones:
    get:
      operationId: getWorldZones
      tags: [world]
      summary: Get player count per zone (ghosts + real player)
      responses:
        "200":
          description: Zone population data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ZonePopulation"

  /world/leaderboard:
    get:
      operationId: getWorldLeaderboard
      tags: [world]
      summary: Get top 10 by level then kill_count (ghosts + real player)
      responses:
        "200":
          description: Leaderboard data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /world/stats:
    get:
      operationId: getWorldStats
      tags: [world]
      summary: Get aggregate world statistics
      responses:
        "200":
          description: World stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldStats"

  # ─── LLM GAME MASTER ────────────────────────────────────────────────────────────
  /quests/generate:
    post:
      operationId: generateQuests
      tags: [gm]
      summary: Generate a batch of AI quests for the current character
      responses:
        "200":
          description: Generated quests (batch of 3–5)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quest"

  /quests:
    get:
      operationId: getQuests
      tags: [gm]
      summary: Get all quests (active and completed)
      responses:
        "200":
          description: Quest list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quest"

  /quests/{id}/complete:
    patch:
      operationId: completeQuest
      tags: [gm]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Mark a quest as completed and claim rewards
      responses:
        "200":
          description: Quest completion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestCompleteResult"

  /npc/dialogue:
    post:
      operationId: getNpcDialogue
      tags: [gm]
      summary: Get AI-generated NPC dialogue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NpcDialogueRequest"
      responses:
        "200":
          description: NPC dialogue response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NpcDialogueResponse"

  /character/lore:
    get:
      operationId: getCharacterLore
      tags: [gm]
      summary: Get AI-generated lore entry for the character
      responses:
        "200":
          description: Character lore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterLoreResponse"

  /world/player/{id}/quote:
    get:
      operationId: getWorldPlayerQuoteById
      tags: [gm]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      summary: Get AI-generated quote for a world/ghost player by ID
      responses:
        "200":
          description: Player quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerQuoteResponse"

  /world/player/by-name/{name}/quote:
    get:
      operationId: getWorldPlayerQuoteByName
      tags: [gm]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      summary: Get AI-generated quote for a world/ghost player by name
      responses:
        "200":
          description: Player quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerQuoteResponse"

  /combat/boss-narration/{bossId}:
    get:
      operationId: getBossNarration
      tags: [gm]
      parameters:
        - name: bossId
          in: path
          required: true
          schema:
            type: string
        - name: phase
          in: query
          schema:
            type: string
            enum: [intro, death]
      summary: Get AI-generated boss narration (intro or death speech)
      responses:
        "200":
          description: Boss narration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BossNarrationResponse"

  # ─── GAME SUMMARY ──────────────────────────────────────────────────────────────
  /game/summary:
    get:
      operationId: getGameSummary
      tags: [character]
      summary: Get overall game progress summary
      responses:
        "200":
          description: Game summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── CHARACTER ────────────────────────────────────────────────────────────
    Character:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        race:
          type: string
        class:
          type: string
        archetype:
          type: string
          enum: [Fighter, Scout, Mage, Priest]
        level:
          type: integer
        xp:
          type: number
        xpToNextLevel:
          type: number
        aaPoints:
          type: integer
        aaPointsSpent:
          type: integer
        gold:
          type: number
        health:
          type: number
        maxHealth:
          type: number
        power:
          type: number
        maxPower:
          type: number
        baseStats:
          $ref: "#/components/schemas/BaseStats"
        gear:
          $ref: "#/components/schemas/GearSet"
        zone:
          type: string
        activeMount:
          type: string
        alignment:
          type: string
          enum: [Qeynos, Freeport, Neutral]
        totalPlayTime:
          type: number
        killCount:
          type: integer
        deathCount:
          type: integer
        autoLoop:
          type: boolean
        autoHeal:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
