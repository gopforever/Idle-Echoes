        icon:
          type: string
        maxLevel:
          type: integer
      required: [id, name, description, category, level, xp, xpToNextLevel, isTraining, xpPerHour, icon, maxLevel]

    SkillsSummary:
      type: object
      properties:
        totalLevel:
          type: integer
        totalXp:
          type: number
        activeTrainingCount:
          type: integer
        highestSkill:
          $ref: "#/components/schemas/Skill"
        skillsByCategory:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Skill"
      required: [totalLevel, totalXp, activeTrainingCount]

    # ─── CRAFTING ────────────────────────────────────────────────────────────
    CraftingRecipe:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        resultItemId:
          type: string
        resultQuantity:
          type: integer
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecipeIngredient"
        requiredSkillLevel:
          type: integer
        requiredSkillId:
          type: string
        craftingTime:
          type: number
        xpReward:
          type: number
      required: [id, name, resultItemId, resultQuantity, ingredients, requiredSkillLevel, requiredSkillId, craftingTime, xpReward]

    RecipeIngredient:
      type: object
      properties:
        itemId:
          type: string
        quantity:
          type: integer
      required: [itemId, quantity]

    CraftRequest:
      type: object
      properties:
        recipeId:
          type: string
      required: [recipeId]

    CraftResult:
      type: object
      properties:
        success:
          type: boolean
        resultItem:
          $ref: "#/components/schemas/Item"
        xpGained:
          type: number
        message:
          type: string
      required: [success, xpGained, message]

    # ─── WORLD / GHOST PLAYERS ───────────────────────────────────────────────
    WorldPlayer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        race: { type: string }
        class: { type: string }
        archetype: { type: string }
        alignment: { type: string }
        level: { type: integer }
        xp: { type: number }
        xpToNextLevel: { type: number }
        gold: { type: number }
        zone: { type: string }
        killCount: { type: integer }
        deathCount: { type: integer }
        bossKills: { type: integer }
        totalGoldEarned: { type: number }
        stats:
          type: object
          properties:
            strength: { type: number }
            agility: { type: number }
            stamina: { type: number }
            intelligence: { type: number }
            wisdom: { type: number }
            charisma: { type: number }
          required: [strength, agility, stamina, intelligence, wisdom, charisma]
        lastTickAt: { type: string }
        createdAt: { type: string }
      required: [id, name, race, class, archetype, alignment, level, xp, xpToNextLevel, gold, zone, killCount, deathCount, bossKills, totalGoldEarned, stats, lastTickAt, createdAt]

    WorldEvent:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        message: { type: string }
        playerName: { type: string }
        zone: { type: string }
        importance: { type: integer }
        tick: { type: integer }
        createdAt: { type: string }
      required: [id, type, message, playerName, zone, importance, tick, createdAt]

    LeaderboardEntry:
      type: object
      properties:
        rank: { type: integer }
        id: { type: integer }
        name: { type: string }
        race: { type: string }
        class: { type: string }
        archetype: { type: string }
        level: { type: integer }
        killCount: { type: integer }
        bossKills: { type: integer }
        zone: { type: string }
        totalGoldEarned: { type: number }
        isRealPlayer: { type: boolean }
      required: [rank, id, name, race, class, archetype, level, killCount, bossKills, zone, totalGoldEarned]

    ZonePopulation:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        levelRange: { type: string }
        ghostCount: { type: integer }
        realCount: { type: integer }
        total: { type: integer }
      required: [id, name, levelRange, ghostCount, realCount, total]

    WorldStats:
      type: object
      properties:
        totalPlayers: { type: number }
        totalKills: { type: number }
        totalBossKills: { type: number }
        totalGoldEarned: { type: number }
        avgLevel: { type: number }
        maxLevel: { type: number }
        totalEvents: { type: number }
      required: [totalPlayers, totalKills, totalBossKills, totalGoldEarned, avgLevel, maxLevel, totalEvents]

    # ─── LLM GAME MASTER ─────────────────────────────────────────────────────
    QuestObjective:
      type: object
      properties:
        text: { type: string }
        completed: { type: boolean }
        progress: { type: integer }
        total: { type: integer }
        type:
          type: string
          enum: [kill, collect, talk, explore, faction]
        target: { type: string, nullable: true }
      required: [text, completed, progress, total, type]

    Quest:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        objectives:
          type: array
          items:
            $ref: "#/components/schemas/QuestObjective"
        rewards:
          type: object
          properties:
            xp: { type: number }
            gold: { type: number }
            item: { type: string }
            aaXp: { type: number }
        zone: { type: string }
        difficulty: { type: string }
        completed: { type: boolean }
        completedAt: { type: string, nullable: true }
        lore: { type: string, nullable: true }
        bossId: { type: string, nullable: true }
        createdAt: { type: string }
      required: [id, title, description, objectives, rewards, zone, difficulty, completed, createdAt]

    QuestCompleteResult:
      type: object
      properties:
        quest:
          $ref: "#/components/schemas/Quest"
        reward:
          type: object
          properties:
            xp: { type: number }
            gold: { type: number }
        message: { type: string }
      required: [quest, message]

    NpcDialogueRequest:
      type: object
      properties:
        npcName: { type: string }
        npcRole: { type: string }
        playerMessage: { type: string }
        context: { type: string }
      required: [npcName, playerMessage]

    NpcDialogueResponse:
      type: object
      properties:
        npcName: { type: string }
        reply: { type: string }
        role: { type: string }
      required: [npcName, reply, role]

    CharacterLoreResponse:
      type: object
      properties:
        lore: { type: string }
        cached: { type: boolean }
      required: [lore, cached]

    PlayerQuoteResponse:
      type: object
      properties:
        quote: { type: string }
        cached: { type: boolean }
      required: [quote, cached]

    BossNarrationResponse:
      type: object
      properties:
        narration: { type: string }
        cached: { type: boolean }
        bossId: { type: string }
        phase: { type: string }
      required: [narration, cached, bossId, phase]

    # ─── GAME SUMMARY ────────────────────────────────────────────────────────
    GameSummary:
      type: object
      properties:
        character:
          $ref: "#/components/schemas/Character"
        totalSkillLevels:
          type: integer
        killCount:
          type: integer
        goldEarned:
          type: number
        itemsFound:
          type: integer
        currentZone:
          type: string
        combatActive:
          type: boolean
        activeSkillTraining:
          type: integer
        achievementsCompleted:
          type: integer
        factionsPositive:
          type: integer
      required:
        - totalSkillLevels
        - killCount
        - goldEarned
        - itemsFound
        - currentZone
        - combatActive
        - activeSkillTraining
        - achievementsCompleted
        - factionsPositive
