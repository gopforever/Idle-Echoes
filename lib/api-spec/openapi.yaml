          type: number
        xp:
          type: number
        level:
          type: integer
        autoLoop:
          type: boolean
        autoHeal:
          type: boolean

    CombatSettings:
      type: object
      description: >
        Partial settings patch — only fields provided are updated.
        All fields are optional so callers can send a single-field patch
        (e.g. { isMeditating: true }) without supplying unrelated settings.
      properties:
        autoLoop:
          type: boolean
        autoHeal:
          type: boolean
        autoPotions:
          type: boolean
        isMeditating:
          type: boolean
          description: >
            Whether the character is in meditation mode. Server ignores
            attempts to enable this while in active combat.

    RegenResult:
      type: object
      description: Result of a passive/meditation regen tick
      properties:
        health:
          type: number
          description: Current HP after regen
        maxHealth:
          type: number
        power:
          type: number
          description: Current Power after regen
        maxPower:
          type: number
        hpGain:
          type: number
          description: HP restored this tick (0 on guard short-circuits)
        pwrGain:
          type: number
          description: Power restored this tick (0 on guard short-circuits)
        isMeditating:
          type: boolean
        meditationLevel:
          type: number
          description: Actual Meditation skill level (always reflects current DB value)
        regenPerTick:
          type: object
          description: Projected HP and Power gain per 3-second tick at current stats
          properties:
            hp:
              type: number
            pwr:
              type: number
          required: [hp, pwr]
      required: [health, maxHealth, power, maxPower, hpGain, pwrGain, isMeditating, meditationLevel, regenPerTick]

